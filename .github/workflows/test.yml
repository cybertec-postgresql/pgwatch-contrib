name: Test

on:
  push:
    branches: [ "main" ]
    paths:
      - "rpc/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "rpc/**"
  schedule:
    # Nightly full run, including the container-backed receivers that pull
    # requests skip.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpc
    steps:  

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'rpc/go.mod'

      - name: Setup Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Generate protobuf files
        run: go generate ./sinks/pb/

      - name: GolangCI-Lint 
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: rpc

  Unit-Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpc
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'rpc/go.mod'
        cache-dependency-path: 'rpc/go.sum'

    - name: Setup Protobuf
      uses: ./.github/actions/setup-protobuf

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' 

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pytest
        pip install -r cmd/pyiceberg_receiver/requirements.txt

    - name: gRPC Golang Tests
      # Pull requests run with -short, which skips the container-backed
      # receivers: a dozen containers on one runner made the job slow and
      # flaky. They still run on pushes to main, nightly and on demand.
      env:
        SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
      run: |
        go generate ./sinks/pb
        go test -timeout 20m -failfast -v $SHORT -coverprofile=profile.cov ./...

    - name: gRPC Python Tests
      if: github.event_name != 'pull_request'
      run: |
        python3 -m grpc_tools.protoc -I sinks/pb --python_out=cmd/pyiceberg_receiver --grpc_python_out=cmd/pyiceberg_receiver sinks/pb/pgwatch.proto
        pytest

    - name: Coveralls
      if: github.event_name != 'pull_request'
      uses: coverallsapp/github-action@v2
      with:
        file: rpc/profile.cov 
